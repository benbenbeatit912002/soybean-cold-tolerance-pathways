<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Saved pathway network</title>
  <style>
:root {
  color-scheme: light;
  --ink: #192d2b;
  --muted: #526560;
  --line: #d9e2dd;
  --paper: #fff;
  --green: #176654;
  --wash: #f2f5f1;
  --mono: "IBM Plex Mono",Consolas,monospace;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--wash);
  color: var(--ink);
  font: 15px/1.47 "Inter","Segoe UI",sans-serif;
}

button,input,select {
  font: inherit;
}

button,a,input,select,summary {
  outline-offset: 3px;
}

button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible {
  outline: 3px solid #359d86;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: default;
  opacity: .48;
}

a {
  color: var(--green);
}

h1,h2,h3,p {
  margin: 0;
}

h2 {
  font-size: 20px;
  letter-spacing: -.035em;
  font-weight: 650;
}

h3 {
  font-size: 14px;
  font-weight: 650;
}

small,.muted,.note {
  color: var(--muted);
}

small {
  font-size: 12px;
}

.mono,.number {
  font-variant-numeric: tabular-nums;
}

.mono {
  font-family: var(--mono);
}

.top {
  background: #16352f;
  color: #edf8f1;
}

.top-inner,.frame {
  max-width: 1500px;
  margin: 0 auto;
  padding: 0 clamp(18px,4.8vw,76px);
}

.top-inner {
  min-height: 66px;
  display: flex;
  align-items: center;
  gap: 40px;
}

.brand {
  display: flex;
  gap: 12px;
  align-items: center;
  color: white;
  text-decoration: none;
  font-weight: 650;
  letter-spacing: -.035em;
  font-size: 20px;
  white-space: nowrap;
}

.mark {
  width: 31px;
  height: 32px;
  border-radius: 7px;
  background: #c6ebbb;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 3px;
  transform: rotate(-3deg);
}

.mark i {
  display: block;
  width: 3px;
  border-radius: 2px;
  background: #245040;
  transform: skew(-13deg);
}

.mark i:nth-child(1) {
  height: 10px;
}

.mark i:nth-child(2) {
  height: 20px;
}

.mark i:nth-child(3) {
  height: 15px;
}

nav {
  display: flex;
  gap: 23px;
  align-self: stretch;
}

nav a {
  display: flex;
  align-items: center;
  color: #c2d4cc;
  text-decoration: none;
  font-size: 14px;
  border-bottom: 3px solid transparent;
  padding-top: 3px;
}

nav a[aria-current=page] {
  color: white;
  border-color: #b8deb0;
}

nav a:hover {
  color: white;
}

.local {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: #dcebe4;
}

.local i {
  width: 8px;
  height: 8px;
  background: #b0e1a8;
  border-radius: 50%;
}

.frame {
  padding-bottom: 52px;
}

.heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin: 36px 0 28px;
}

h1 {
  font-size: clamp(32px,3.4vw,49px);
  font-weight: 590;
  line-height: 1.13;
  letter-spacing: -.055em;
}

.heading p {
  margin-top: 8px;
  color: var(--muted);
  font-size: 15px;
}

.secondary,.small-button,.primary {
  border: 1px solid #baccc2;
  border-radius: 7px;
  font-weight: 600;
  background: white;
  color: var(--ink);
}

.secondary {
  padding: 9px 14px;
  white-space: nowrap;
}

.secondary span,.primary span {
  margin-left: 9px;
}

.secondary:hover,.small-button:hover:enabled {
  background: #edf4ef;
}

.workspace {
  display: grid;
  grid-template-columns: minmax(254px,300px) minmax(0,1fr);
  gap: 22px;
  align-items: start;
}

.panel,.metrics {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: 0 2px 5px #203c2b05;
}

.panel-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 20px;
  border-bottom: 1px solid var(--line);
}

.text-button {
  border: 0;
  background: transparent;
  color: var(--green);
  font-size: 12px;
  font-weight: 650;
  padding: 4px 0;
}

.text-button:hover {
  text-decoration: underline;
}

.setup-body {
  padding: 16px 18px 18px;
}

.dataset {
  padding: 12px;
  display: flex;
  gap: 11px;
  align-items: center;
  border-radius: 8px;
  background: #edf3e8;
  border: 1px solid #d9e6d2;
  margin-bottom: 17px;
}

.dataset-icon {
  font-size: 24px;
  color: #477144;
}

.dataset small,.dataset b {
  display: block;
}

.dataset b {
  font-size: 14px;
}

.dataset small {
  margin-top: 1px;
}

.row-split,.member-header,.dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.setup-body h3 {
  margin: 9px 0;
}

.file-label {
  position: relative;
  display: block;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  margin: 6px 0 10px;
}

.file-label>span:first-child {
  float: right;
  font: 10px var(--mono);
  color: var(--muted);
}

.file-label input {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 32px;
  opacity: 0;
  cursor: pointer;
}

.file-label input:focus-visible+.file-name {
  outline: 3px solid #359d86;
}

.file-name {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  margin-top: 3px;
  border: 1px dashed #acbeb4;
  border-radius: 5px;
  padding: 6px 10px;
  color: #49635a;
  font: 12px/1.4 var(--mono);
}

.file-label:hover .file-name {
  background: #f4f8f4;
}

.method-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px 4px;
  margin-bottom: 14px;
}

.check {
  display: flex!important;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  color: var(--ink);
}

input[type=checkbox] {
  accent-color: var(--green);
  width: 15px;
  height: 15px;
  margin: 0;
  flex: 0 0 auto;
}

.setup details {
  border-top: 1px solid var(--line);
}

summary {
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  padding: 10px 1px;
  color: #3b5148;
}

.settings {
  display: grid;
  gap: 9px;
  padding: 0 0 12px;
}

.settings .file-label {
  margin: 0;
}

.pair {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}

label:has(>select),label:has(>input:not([type=file]):not([type=checkbox])) {
  display: grid;
  gap: 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}

input:not([type=checkbox]):not([type=file]),select {
  width: 100%;
  height: 36px;
  border: 1px solid #c3d1c7;
  border-radius: 6px;
  background: white;
  color: var(--ink);
  padding: 5px 9px;
  min-width: 0;
  font-weight: 400;
  font-size: 13px;
}

input:disabled {
  background: #f1f3f0!important;
}

.primary {
  width: 100%;
  background: var(--green);
  color: white;
  border-color: var(--green);
  padding: 10px;
  margin-top: 10px;
}

.primary:hover:enabled {
  background: #114d40;
}

.feedback {
  font-size: 12px;
  color: var(--muted);
  margin-top: 8px;
}

.feedback:empty,.note:empty {
  display: none;
}

.error {
  color: #9b3431;
}

.results {
  min-width: 0;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(3,1fr);
  padding: 18px 0;
  margin-bottom: 16px;
}

.metrics div {
  padding: 0 clamp(12px,2vw,27px);
  border-right: 1px solid var(--line);
}

.metrics div:last-child {
  border: 0;
}

.metrics span,.metrics strong {
  display: block;
}

.metrics span {
  color: var(--muted);
  font-size: 12px;
}

.metrics strong {
  font: 600 32px/1.25 "Inter","Segoe UI",sans-serif;
  letter-spacing: -.045em;
  font-variant-numeric: tabular-nums;
}

.output {
  overflow: hidden;
}

.panel-title .muted {
  font-size: 12px;
}

.filters {
  display: grid;
  grid-template-columns: 1.2fr 1.3fr .8fr .8fr;
  gap: 10px;
  padding: 15px 20px;
  border-bottom: 1px solid var(--line);
  background: #fbfcf9;
}

.table-tools,.paging {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 20px;
}

.tabs {
  display: inline-flex;
  padding: 2px;
  background: #edf1ed;
  border-radius: 7px;
}

.tabs button {
  border: 0;
  background: transparent;
  border-radius: 5px;
  color: var(--muted);
  padding: 5px 9px;
  font-size: 12px;
  font-weight: 600;
}

.tabs button[aria-pressed=true] {
  background: white;
  color: var(--green);
  box-shadow: 0 1px 3px #132a1c28;
}

.table-tools input {
  max-width: 175px;
}

.table-scroll,.member-scroll {
  overflow-x: auto;
}

table {
  border-spacing: 0;
  width: 100%;
  text-align: left;
  font-size: 13px;
}

th {
  font-size: 11px;
  color: var(--muted);
  font-weight: 650;
  background: #f3f6f2;
  white-space: nowrap;
}

th,td {
  padding: 10px 9px;
  border-bottom: 1px solid #e3e9e2;
  vertical-align: middle;
}

th:first-child,td:first-child {
  padding-left: 20px;
}

td:last-child,th:last-child {
  padding-right: 19px;
}

.number {
  text-align: right;
  white-space: nowrap;
}

.result-table tr:hover td {
  background: #f6f9f4;
}

.term,.detail-button {
  background: none;
  border: 0;
  color: var(--green);
  padding: 0;
  text-align: left;
  font-weight: 650;
}

.term:hover {
  text-decoration: underline;
}

.go-id {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font: 11px/1.3 var(--mono);
}

.method-tag {
  display: inline-block;
  border-radius: 4px;
  padding: 2px 6px;
  background: #eaf2ee;
  color: #315c50;
  font-size: 11px;
  white-space: nowrap;
}

.prob {
  font-family: var(--mono);
  font-size: 12px;
}

.detail-button {
  font-size: 18px;
}

.paging {
  min-height: 49px;
  color: var(--muted);
  font-size: 12px;
}

.paging>div {
  display: flex;
  gap: 5px;
}

.small-button {
  height: 28px;
  min-width: 30px;
}

.empty {
  padding: 27px 20px;
  color: var(--muted);
}

.note {
  font-size: 12px;
  margin: 10px 2px;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}

dialog {
  width: min(820px,94vw);
  max-height: 86vh;
  border: 1px solid #bdcec2;
  border-radius: 14px;
  padding: 22px;
  background: white;
  color: var(--ink);
  box-shadow: 0 16px 65px #19392e35;
}

dialog::backdrop {
  background: #152e2780;
}

dialog h2 {
  font-size: 27px;
  margin: 9px 0;
}

.dialog-head .mono,.detail-meta {
  font-size: 12px;
  color: var(--muted);
}

.detail-meta {
  margin: 7px 0;
}

.member-header {
  margin: 20px 0 8px;
}

.member-header input {
  max-width: 230px;
}

.member-scroll {
  max-height: 48vh;
  overflow: auto;
}

.member-scroll th {
  position: sticky;
  top: 0;
}

.member-scroll td {
  min-width: 95px;
}

.member-scroll small {
  display: block;
}

.member-scroll a,#detail-link a {
  font-size: 12px;
}

.guide {
  max-width: 920px;
  padding: 39px 24px 70px;
  margin: auto;
}

.guide h2 {
  margin: 28px 0 8px;
}

.guide p,.guide li {
  line-height: 1.6;
}

.guide code {
  background: #e8eee8;
  padding: 1px 4px;
  border-radius: 3px;
}

@media(max-width:970px) {
  .top-inner,.frame {
    padding-left: 18px;
    padding-right: 18px;
  }
  .workspace {
    grid-template-columns: 245px minmax(0,1fr);
    gap: 13px;
  }
  .filters {
    grid-template-columns: 1fr 1fr;
  }
  .table-tools,.filters,.panel-title {
    padding-left: 13px;
    padding-right: 13px;
  }
  .metrics strong {
    font-size: 29px;
  }
  .result-table th:first-child,.result-table td:first-child {
    padding-left: 12px;
  }
}

@media(max-width:720px) {
  .top-inner {
    gap: 15px;
    min-height: 55px;
  }
  .brand {
    font-size: 16px;
    gap: 7px;
  }
  .mark {
    width: 25px;
    height: 26px;
  }
  nav {
    margin-left: auto;
    gap: 12px;
  }
  nav a {
    font-size: 12px;
  }
  .local {
    display: none;
  }
  .heading {
    margin: 24px 0 19px;
    align-items: start;
  }
  .heading p {
    font-size: 13px;
  }
  .workspace {
    display: flex;
    flex-direction: column;
  }
  .setup,.results {
    width: 100%;
  }
  .metrics {
    margin-top: 3px;
  }
  .metrics span {
    font-size: 11px;
  }
  .frame {
    padding: 0 12px 28px;
  }
  .setup-body {
    padding: 12px 15px;
  }
  .table-tools {
    flex-wrap: wrap;
  }
  .table-tools input {
    max-width: 155px;
  }
  .result-table {
    min-width: 450px;
  }
  .panel-title .muted {
    max-width: 45%;
    text-align: right;
  }
  .secondary {
    font-size: 12px;
    padding: 7px;
  }
  .member-header {
    flex-wrap: wrap;
  }
}

:root {
  --ink: #202e32;
  --muted: #52646a;
  --line: #cbd2ce;
  --rule: #81928b;
  --paper: #fffefa;
  --wash: #f6f5ef;
  --green: #155b51;
  --copper: #a35323;
  --shared: #705779;
  --serif: "STIX Two Text", "Baskerville", Georgia, serif;
  --sans: "Source Sans 3", "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
}
body { background:var(--wash); color:var(--ink); font:15px/1.5 var(--sans); }
[hidden] { display:none !important; }
.top { background:var(--paper); color:var(--ink); border-top:4px solid var(--green); border-bottom:1px solid var(--line); }
.top-inner,.frame { max-width:1540px; padding-inline:clamp(20px,4vw,64px); }
.top-inner { min-height:52px; display:flex; justify-content:space-between; align-items:center; }
.brand { color:var(--ink); font:600 19px/1.2 var(--sans); letter-spacing:-.035em; }
.brand::before { content:""; width:12px; height:12px; display:inline-block; background:var(--green); transform:rotate(45deg); }
.mast-actions,.study-buttons,.figure-files,.view-nav,.zoom-actions { display:flex; align-items:center; flex-wrap:wrap; }
.mast-actions { gap:24px; }
.mast-actions a,.study-bar>a,.figure-files a,.figure-files button { color:var(--green); font:600 13px/1.4 var(--sans); text-underline-offset:3px; }
.mast-actions a { text-decoration:none; }
.mast-actions a:hover,.figure-files button:hover { text-decoration:underline; }
.secondary,.small-button,.primary,.tabs,.tabs button,select,input:not([type=checkbox]):not([type=file]),dialog,.file-name { border-radius:3px; }
.secondary,.small-button { background:var(--paper); border-color:#a6b1ab; }
.secondary { padding:6px 12px; font-size:13px; }
.frame { padding-bottom:48px; }
.heading { align-items:flex-end; margin:0; padding:24px 0 20px; }
.heading i,.reader-heading i { color:var(--green); font:italic 17px/1.2 var(--serif); }
h1,.spread-head h2,.guide h1,dialog h2 { font-family:var(--serif); font-weight:normal; letter-spacing:-.045em; }
h1 { font-size:clamp(36px,4vw,60px); line-height:1.02; margin:4px 0 0; }
.study-totals { display:flex; gap:clamp(18px,3vw,48px); margin:0 0 2px; }
.study-totals div { display:flex; flex-direction:column-reverse; }
.study-totals dt { font-size:12px; color:var(--muted); }
.study-totals dd { margin:0; font:normal clamp(23px,2.1vw,32px)/1.15 var(--serif); font-variant-numeric:tabular-nums; }
.study-bar { display:flex; align-items:center; flex-wrap:wrap; gap:16px; border-block:1px solid var(--rule); padding:8px 0; }
.study-bar strong { color:var(--muted); font-size:13px; }
.study-buttons { gap:4px; }
.study-bar button,.tabs button { border:0; background:transparent; color:var(--muted); padding:6px 12px; font-size:13px; }
.study-bar button[aria-pressed=true],.tabs button[aria-pressed=true] { color:var(--paper); background:var(--green); box-shadow:none; }
.study-bar button:hover:not([aria-pressed=true]),.tabs button:hover:not([aria-pressed=true]) { color:var(--ink); background:#e7ebe5; }
.study-bar>a { margin-left:auto; }
.workspace { display:grid; grid-template-columns:minmax(198px,224px) minmax(0,1fr); gap:clamp(24px,3vw,48px); align-items:start; margin-top:24px; }
.controls { border-right:1px solid var(--line); padding-right:24px; min-width:0; }
.filter-rail>summary,.setup-toggle,.network-inspect>label { color:var(--ink); font:600 16px/1.35 var(--sans); }
.filter-rail>summary { padding:6px 0 12px; }
.filters { display:grid; grid-template-columns:minmax(0,1fr); gap:14px; padding:0 0 20px; border:0; background:none; }
.filters label,.network-tools label,.protein-form label { display:block; color:var(--muted); font-size:12px; font-weight:600; }
select,input:not([type=checkbox]):not([type=file]) { border-color:#b7c2bc; background:var(--paper); color:var(--ink); min-height:36px; }
.pair { gap:8px; }
.tabs { display:inline-flex; justify-self:start; border:1px solid #aab6af; background:var(--paper); padding:0; overflow:hidden; }
.tabs button { font-size:12px; border-radius:0; padding:6px 10px; }
.setup { border-block:1px solid var(--line); background:none; }
.setup .panel-title { border:0; align-items:center; flex-wrap:wrap; padding:12px 0; gap:8px; }
.setup .panel-title h2 { font-size:16px; }
.setup-toggle { background:none; border:0; padding:0; }
.setup-toggle::after { content:" −"; font-weight:400; }
.setup-toggle[aria-expanded=false]::after { content:" +"; }
.setup-body { padding:0 0 16px; }
.dataset { background:#e9ede5; border:0; border-left:2px solid var(--green); border-radius:0; }
.dataset-icon { display:none; }
.view-nav { min-height:36px; gap:24px; border-bottom:1px solid var(--rule); }
.view-nav a { border-bottom:3px solid transparent; margin-bottom:-1px; padding:3px 0 9px; font:600 15px/1.35 var(--sans); }
.view-nav a,.view-nav a:hover { color:var(--muted); text-decoration:none; }
.view-nav a[aria-current=page] { color:var(--green); border-color:var(--green); }
.view-nav>span { margin-left:auto; align-self:center; color:var(--muted); font-size:13px; }
.output,.network { overflow:visible; border:0; background:none; }
.spread-head { padding:18px 0 12px; }
.spread-head h2 { margin:0; font-size:clamp(28px,2.9vw,44px); line-height:1.08; }
.spread-head p,.network-count,.guide p { color:var(--muted); }
.spread-head p,.network-count { margin:6px 0 0; padding:0; font-size:13px; line-height:1.45; }
.figure-options { border-top:1px solid var(--line); }
.figure-options summary,.protein-tools summary { padding:7px 0; color:var(--green); }
.network-tools { display:grid; grid-template-columns:1.35fr 1.1fr .8fr; gap:12px; padding:0 0 12px; }
.network-spread { display:grid; grid-template-columns:minmax(0,1fr) clamp(180px,17vw,250px); border-block:1px solid var(--rule); background:var(--paper); }
.plot-column { min-width:0; }
.network-surface { position:relative; }
#network-svg { display:block; width:100%; height:auto; min-height:255px; aspect-ratio:780/370; touch-action:none; user-select:none; cursor:grab; }
#network-svg:focus-visible { outline:2px solid var(--green); outline-offset:-2px; }
#network-svg.is-panning,#network-svg.is-panning * { cursor:grabbing; }
.network-navigation,.zoom-actions { display:flex; align-items:center; gap:6px; }
.network-navigation { border-top:1px solid var(--line); justify-content:space-between; flex-wrap:wrap; padding:6px 12px; }
.zoom-hint,.zoom-actions output { color:var(--muted); font-size:12px; }
.zoom-actions output { min-width:40px; text-align:center; font-variant-numeric:tabular-nums; }
.zoom-actions button { min-width:30px; height:28px; border:1px solid #b7c2bc; background:var(--paper); color:var(--green); }
.network-empty { position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; color:var(--muted); }
.net-node,.net-edge { cursor:pointer; }
.node-target,.edge-target { fill:transparent; }
.edge-target { stroke:transparent; stroke-width:7; }
.visible-line { stroke:#829b99; opacity:.55; }
.net-edge.membership .visible-line { stroke:#7c9997; opacity:.40; }
.net-edge.short .visible-line { stroke:var(--green); }
.net-edge.middle .visible-line { stroke:var(--copper); }
.net-node .node-mark { fill:var(--green); stroke:var(--paper); stroke-width:1.3px; }
.net-node.gene .node-mark,.net-node.middle .node-mark { fill:var(--copper); }
.net-node.both .node-mark { fill:var(--shared); }
.net-node text { fill:#284b49; font:600 10px var(--mono); paint-order:stroke; stroke:var(--paper); stroke-width:3px; stroke-linejoin:round; }
.net-node.dim { opacity:.32; }
.net-edge.dim { opacity:.15; }
.net-edge.active .visible-line { stroke:var(--green); opacity:.72; stroke-width:1.9; }
.net-node:focus,.net-edge:focus { outline:none; }
.net-node:focus .node-mark,.net-node:hover .node-mark { stroke:var(--ink); stroke-width:2.4; }
.net-tip { pointer-events:none; }
.net-tip rect { fill:var(--ink); }
.net-tip text { fill:white; font:11px var(--sans); }
.net-tip .tip-title { font-weight:650; }
.network-inspect { display:flex; flex-direction:column; gap:16px; border-left:1px solid var(--line); background:#f0f2ec; padding:16px; min-width:0; }
.network-inspect>label { display:block; }
.network-inspect select { text-overflow:ellipsis; width:100%; margin-top:8px; font-size:12px; }
.network-detail { flex:1; font-size:13px; color:var(--muted); overflow-wrap:anywhere; }
.network-detail strong,.network-detail span { display:block; }
.network-detail strong { color:var(--ink); font-size:15px; line-height:1.4; margin-bottom:8px; }
.record-links { display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 12px; margin-top:6px; font-size:12px; }
.lookup-product,.protein-results a { color:var(--green); text-underline-offset:3px; }
.network-legend { display:flex; flex-wrap:wrap; gap:6px 14px; padding-top:10px; border-top:1px solid var(--line); color:var(--muted); font-size:12px; }
.network-legend span { display:inline-flex; align-items:center; gap:7px; }
.network-legend span::before { content:""; width:8px; height:8px; background:var(--green); transform:rotate(45deg); }
.network-legend .legend-gene::before { border-radius:50%; background:var(--copper); }
.network-legend .legend-middle::before { background:var(--copper); }
.network-legend .legend-both::before { background:var(--shared); }
.network-legend .legend-overlap::before { width:16px; height:2px; transform:none; }
.protein-tools { margin-top:8px; }
.protein-form { display:flex; align-items:end; gap:12px; flex-wrap:wrap; margin:8px 0 12px; }
.protein-form label:first-child { flex:1 1 200px; }
.protein-form label:nth-child(2) { width:116px; }
.protein-form button { height:36px; padding-inline:10px; }
.protein-results { border-left:3px solid var(--green); padding:8px 12px; margin:8px 0; background:#e9eee8; font-size:13px; }
.protein-results strong { display:block; }
.protein-results ul { margin:4px 0 0; padding-left:20px; }
.figure-files { gap:18px; margin-top:4px; border-block:1px solid var(--line); padding:6px 0; }
.table-scroll { border-block:1px solid var(--rule); }
.result-table { background:var(--paper); min-width:535px; }
.result-table th { background:#e9ede6; font-size:12px; color:#364949; font-weight:600; }
.result-table td,.result-table th { padding:8px 12px; }
.result-table tbody tr:last-child td { border-bottom:0; }
.result-table .term { color:var(--ink); text-align:left; font:500 17px/1.2 var(--serif); }
.result-table .term:hover { color:var(--green); }
.go-id { margin-top:4px; font:11px/1.25 var(--mono); color:var(--muted); }
.result-table .number { font:12px/1.4 var(--mono); text-align:right; white-space:nowrap; }
.result-table th.number { font:600 12px/1.4 var(--sans); }
.statistic meter { appearance:none; width:clamp(34px,5vw,76px); height:6px; border:0; margin-right:8px; vertical-align:middle; background:#d9e4df; }
.statistic meter::-webkit-meter-bar { background:#d9e4df; border:0; border-radius:0; height:6px; }
.statistic meter::-webkit-meter-optimum-value { background:var(--green); }
.statistic meter::-moz-meter-bar { background:var(--green); }
.detail-button { font-weight:500; }
.paging { padding:8px 0; }
.note { margin:12px 0; font-size:12px; }
.guide h1 { font-size:44px; }
dialog { background:var(--paper); border:1px solid var(--rule); }
dialog h2 { font-size:30px; }
.figure-reader .frame { max-width:1360px; }
.figure-reader .top a { color:var(--green); font-weight:600; font-size:13px; text-underline-offset:3px; }
.figure-reader .view-nav { padding-top:4px; }
.figure-reader .view-nav>span { text-align:right; }
#figure-svg { display:block; width:100%; height:auto; aspect-ratio:780/370; min-height:200px; cursor:grab; touch-action:none; user-select:none; }
#figure-svg g[data-id],#figure-svg line { cursor:pointer; }
#figure-svg.is-panning,#figure-svg.is-panning * { cursor:grabbing; }
#figure-svg text { stroke:var(--paper); }
#figure-svg .selected .node-mark,#figure-svg g:focus .node-mark { stroke:var(--ink); stroke-width:2.6px; }
#figure-svg line.selected,#figure-svg line:focus { stroke:var(--green); opacity:1; stroke-width:2.5px; }
#figure-info a { display:inline-block; margin:4px 8px 0 0; }
#figure-info strong a { display:inline; margin:0; }
.reader-lookup { padding:20px 0; }
.reader-lookup h2 { margin:0; font:normal 24px/1.2 var(--serif); }
.reader-lookup .protein-form { max-width:760px; }
.reader-filter { display:block; width:min(100%,320px); margin:4px 0 14px; color:var(--muted); font-size:12px; font-weight:600; }
@media(max-width:1100px) {
  .workspace { grid-template-columns:185px minmax(0,1fr); gap:20px; }
  .controls { padding-right:16px; }
  .network-spread { grid-template-columns:minmax(0,1fr); }
  .network-inspect { display:grid; grid-template-columns:minmax(145px,.75fr) 1.4fr; gap:10px 20px; border-left:0; border-top:1px solid var(--line); }
  .network-legend { grid-column:1/-1; }
  .network-detail { min-height:45px; }
}
@media(max-width:760px) {
  .top-inner,.frame { padding-inline:16px; }
  .mast-actions { gap:12px; }
  .heading { flex-wrap:wrap; gap:16px; padding-block:18px; }
  .study-totals { gap:20px; }
  .study-totals dd { font-size:22px; }
  .study-bar { gap:8px; }
  .study-bar button { padding:5px 8px; }
  .workspace { display:flex; flex-direction:column; gap:12px; margin-top:12px; }
  .controls { width:100%; border:0; padding:0; }
  .filter-rail { border-top:1px solid var(--line); }
  .filter-rail>summary { padding:8px 0; }
  .filters { grid-template-columns:1fr 1fr; gap:10px; }
  .setup .panel-title { padding:7px 0; }
  .spread-head { padding:12px 0; }
  .network-tools { grid-template-columns:1fr 1fr; }
  .network-inspect { display:flex; gap:8px; padding:12px; }
  #network-svg { min-height:180px; }
  .view-nav { gap:16px; margin:0; }
  .view-nav>span { font-size:12px; }
  .statistic meter { width:34px; }
  .mast-actions a { font-size:12px; }
}
@media(max-width:420px) {
  .brand { font-size:16px; gap:7px; }
  .mast-actions { gap:8px; }
  .study-bar>a { margin-left:0; }
}

</style>

  <script>
function createUniProtSearch() {
  const api = "https://rest.uniprot.org/uniprotkb/search";
  const website = "https://www.uniprot.org/uniprotkb";
  const accession = /^(?:[OPQ][0-9][A-Z0-9]{3}[0-9]|[A-NR-Z][0-9](?:[A-Z][A-Z0-9]{2}[0-9]){1,2})(?:-[1-9][0-9]*)?$/;

  function query(term, taxon = "", ids = []) {
    term = String(term || "").trim();
    taxon = String(taxon || "").trim();
    if (taxon && !/^[1-9]\d*$/.test(taxon)) throw new Error("Enter a numeric taxonomy ID or leave it empty.");
    if (!term) throw new Error("Enter a gene ID, protein name or UniProt accession.");
    const upper = term.toUpperCase();
    const entries = [...new Set(ids.length ? ids : accession.test(upper) ? [upper] : [])];
    if (entries.some(id => !accession.test(id))) throw new Error("Invalid UniProt accession.");
    const phrase = '"' + term.replace(/\\/g,"\\\\").replace(/"/g,'\\"') + '"';
    const expression = entries.length ? entries.map(id => "accession:" + id).join(" OR ") : phrase;
    const text = taxon ? "(" + expression + ") AND organism_id:" + taxon : expression;
    return {term,taxon,text,accessions:entries,byAccession:entries.length > 0,isoforms:entries.some(id => id.includes("-"))};
  }

  function geneAccessions(gene) {
    const listed = (gene.uniprot_accessions || "").split(";");
    return [...new Set([...listed, gene.uniprot_id].filter(Boolean))];
  }

  function forGene(gene, taxon = "") {
    return query(gene.gene_id,taxon,geneAccessions(gene));
  }

  function resultsURL(spec) {
    const url = new URL(website);
    url.searchParams.set("query",spec.text);
    if (spec.isoforms) url.searchParams.set("includeIsoform","true");
    return url.href;
  }

  async function find(spec, signal, request = fetch) {
    const url = new URL(api);
    url.search = new URLSearchParams({query:spec.text,format:"tsv",
      fields:"accession,protein_name,organism_name,reviewed",size:"8"});
    if (spec.isoforms) url.searchParams.set("includeIsoform","true");
    const response = await request(url.href,{signal,credentials:"omit",referrerPolicy:"no-referrer"});
    if (!response.ok) throw new Error(response.status === 429 ?
      "UniProt is receiving too many requests. Please try again shortly." : "UniProt returned HTTP " + response.status + ".");
    const lines = (await response.text()).trimEnd().split(/\r?\n/);
    if (lines.shift() !== "Entry\tProtein names\tOrganism\tReviewed") throw new Error("UniProt returned an unexpected table.");
    const hits = lines.filter(Boolean).map(line => {
      const [id,name,organism,status] = line.split("\t");
      if (!accession.test(id) || status == null) throw new Error("UniProt returned an incomplete protein record.");
      return {id,name,organism,status};
    });
    const count = response.headers.get("x-total-results");
    return {hits,total:count === null ? null : Number(count),release:response.headers.get("x-uniprot-release")};
  }

  function panel(root) {
    let active = null;
    const doc = root.ownerDocument;
    function clear() {
      if (active) active.abort();
      active = null;
      root.replaceChildren(); root.hidden = true;
    }
    function link(label,url) {
      const a = doc.createElement("a");
      a.textContent = label; a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer"; return a;
    }
    async function run(spec) {
      clear();
      const job = new AbortController();
      active = job;
      const title = doc.createElement("strong"), status = doc.createElement("p"), list = doc.createElement("ul");
      title.textContent = "Live UniProtKB results · " + spec.term;
      const source = link("Open results on UniProt ↗",resultsURL(spec));
      status.setAttribute("role","status"); status.textContent = "Searching UniProt…";
      root.replaceChildren(title,source,status,list); root.hidden = false;
      root.scrollIntoView({block:"nearest"});
      const timeout = setTimeout(() => job.abort(),15000);
      try {
        const data = await find(spec,job.signal);
        if (active !== job) return;
        const n = data.hits.length;
        let count = n + (data.total !== null && data.total > n ? " of " + data.total : "") + (n === 1 ? " match" : " matches");
        if (!n) count = "No matching protein records";
        status.textContent = count + (spec.byAccession ? " by accession" : " by text") +
          (spec.taxon ? " · taxonomy " + spec.taxon : "") + (data.release ? " · UniProt release " + data.release : "") + ".";
        if (n && !spec.byAccession) status.textContent += " Text matches are candidate records.";
        for (const hit of data.hits) {
          const li = doc.createElement("li");
          li.append(link(hit.id,"https://www.uniprot.org/uniprotkb/" + hit.id + "/entry"),
            doc.createTextNode(" · " + hit.name + " · " + hit.organism + " · " + hit.status));
          list.append(li);
        }
      } catch (err) {
        if (active !== job) return;
        const reason = job.signal.aborted ? "The request timed out." : err instanceof TypeError ?
          "Check your internet connection." : err.message;
        status.textContent = "Live results unavailable. " + reason + " Retry the search or open the results on UniProt.";
      } finally {
        clearTimeout(timeout);
        if (active === job) active = null;
      }
    }
    function productLink(spec, label) {
      const a = link(label,resultsURL(spec));
      a.className = "lookup-product";
      a.title = "Search UniProt online for " + spec.term;
      a.addEventListener("click", e => {
        if (e.button || e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
        e.preventDefault(); run(spec);
      });
      return a;
    }
    return {run,clear,productLink};
  }

function openSavedNetwork() {

  const known = new Map(Object.values(records).filter(r => r.lookup).map(r => [r.lookup.term.toLowerCase(),r.lookup]));
  search.mountForm(byId("figure-search"), liveResults, taxon, term => known.get(term.toLowerCase()));
  const original = new DOMParser().parseFromString(drawing,"image/svg+xml").documentElement;
  const titles = original.querySelectorAll(":scope > text");
  document.title = titles[0].textContent;
  byId("figure-title").textContent = document.title.split(" · ")[0];
  byId("organism-name").hidden = String(taxon) !== "3847";
  const mode = original.querySelector(":scope > title").textContent;
  byId("figure-mode").textContent = known.size ? "Pathway–gene network" : mode;
  byId("figure-filter").textContent = titles[1].textContent;
  byId("figure-count").textContent = original.querySelector(":scope > desc").textContent;
  const svg = byId("figure-svg"), info = byId("figure-info"), picker = byId("figure-picker");
  const layer = document.importNode(original.querySelector(":scope > g"),true);

  navigation.setLayer(layer);
  const groups = new Map();
  let pinned = null;
  function identify(group) {

    return (group.querySelector("circle.node-mark") ? "gene:" : "path:") + group.dataset.id;
  }

    const key = el.hasAttribute("data-id") ? identify(el) : "";
    const rec = Object.hasOwn(records,key) ? records[key] : null;
    const heading = document.createElement("strong");
    if (rec?.lookup) heading.append(document.createTextNode(rec.lookup.term + " · "),liveResults.productLink(rec.lookup,rec.productLabel));
    else heading.textContent = rec?.heading || el.querySelector("title")?.textContent || key;

  for (const [kind,label] of Object.entries(legend)) {
